id: DECISION-AND-002
title: Play 登録 25 USD・D-U-N-S・Android 検証端末の予算計上（総損失上限 3 万円）
status: open
created_at: "2026-10-20T23:58:00+09:00"
updated_at: "2026-10-21T01:35:00+09:00"
issue: 119
repo: Ryoki63/Challenge
route_class: critical_review
decider: Ryoki63
accountable: pmo-lead
co_accountable: fin-lead
deadline: "2026-10-27T18:00:00+09:00"
question: >-
  Play 登録 25 USD（約 3,700 円 / 1 USD=150 円なら 3,750 円）、D-U-N-S（無料 30 営業日または
  15,000 円・税別で 7 営業日）、事業用住所/電話/ウェブサイト、Android 実機の費用を、
  DECISION-006 の総損失上限 30,000 円の内側にどう計上しますか。
  既知の固定費 + 広告上限 + Play だけで 30,300 円になり、300 円超えます。LLM 費用を上限内に
  数える会計なら、さらに大きく超えます。有料 D-U-N-S を足すと、固定費込みでは 45,300 円です。

context:
  - "Issue #119 は『Play 登録 25 USD（約 3,700 円）は DECISION-006 の総損失上限 3 万円の内数』としている。"
  - "marketing/plan.md §5 の既知の固定費は Apple Developer Program 12,800 円/年 + Supabase Pro 25 USD/月（1 USD=150 円で 3,750 円/月）= 16,550 円。広告の上限は 10,000 円。合計 26,550 円。"
  - "26,550 円 + Play 3,750 円 = 30,300 円で、30,000 円を 300 円超える。"
  - "役職の learnings では、LLM に $3/日を使うと 2026-10-31〜12-31 の 62 日で 29,485 円（1 USD=158.5 円）。これは総損失上限の 98.3%。この会計で LLM を上限内に数えると、Play 3,750 円を足すだけで 33,235 円になり、上限を超える。"
  - "TSR の D-U-N-S 新規発番は、7 営業日 15,000 円/件（税別）または 30 営業日なら無料。納期は受付完了の翌営業日を起算日とした TSR の営業日。"
  - "D&B のシステム反映に数日〜2 か月かかるため、B の公開が 2027-01〜03 まで伸びると、その間の Supabase Pro（11 月〜3 月分 = 3,750 円 × 5 = 18,750 円）をどの計画に計上するかで上限の見え方が変わる。"
  - "個人アカウントは Android 10 以上の実機（非 root）で端末確認が必要。オーナーが実機を持っていない場合、借用（0 円）か購入（額は未見積）かを選ぶ必要がある。"
  - "組織アカウントの事業用住所・電話・ウェブサイトは、既存なら 0 円、新規なら実費（未見積）。バーチャルオフィス・電話・ドメインを新規に契約すると、総損失上限を超える可能性が高い。"
  - "個人事業主は開業届で組織として本人確認できる（Google Play Console の日本向け書類一覧）。これは組織アカウントの適格性を広げるが、D-U-N-S と事業用連絡先の費用は変わらない。"

options:
  - id: A
    label: "上限内に収める（広告 0・端末は借用・無料 D-U-N-S・LLM の扱いを Fin が確定）"
    summary: >-
      広告枠を 0 円にし、Android 実機は借用し、D-U-N-S は無料 30 営業日を選ぶ。Play 3,750 円を上限内に置く。
      LLM 費用を上限に含めるかを含めないかを #126 が確定し、含めるなら日次上限を下げる。
    cost: "Play 3,750 円 + 固定費 16,550 円 = 20,300 円（広告 0、端末借用、D-U-N-S 無料）。残り 9,700 円。"
    pros:
      - "固定費を上限に含める会計でも、LLM を除けば 30,000 円の内側に収まる"
      - "端末購入・広告出稿・有料 D-U-N-S の判断を先送りできる"
      - "新規の事業用住所/電話/ドメイン契約をしない"
    cons:
      - "LLM を上限内に含める会計では成立しない（29,485 円 + 3,750 円 = 33,235 円）"
      - "Supabase Pro の対象期間を 2 か月以上に広げると超過する（5 か月なら固定費だけで 35,300 円）"
      - "端末を借りられない場合は購入費が増える"
      - "無料 D-U-N-S は 30 営業日かかり、B の公開が 2027 年に延びる"
    recommendation: true

  - id: B
    label: "Play・D-U-N-S・端末を上限の外に置く（上限を増額）"
    summary: >-
      Play 3,750 円、有料 D-U-N-S 15,000 円、端末購入費、事業用住所/電話/ドメインを
      「プラットフォームの固定費」として総損失上限の外に置き、上限を増額する。LLM の扱いは別に決める。
    cost: "上限 30,000 円 + Play 3,750 円 + D-U-N-S 15,000 円 + 端末購入費（未見積）+ 事業用住所/電話/ドメイン（未見積）。"
    pros:
      - "有料 D-U-N-S（7 営業日）で発番を早められる"
      - "LLM の日次上限を下げずに済む"
      - "端末を購入できる"
    cons:
      - "総損失上限の意味が変わる。オーナーの再承認が必要"
      - "「損失はそれほど大きくしない」という前提から外れやすい"
      - "広告・Supabase の追加月も同じ論法で外に出したくなる"
    recommendation: false

  - id: C
    label: "Android を延期し、予算を再基準化してから始める"
    summary: >-
      Play の支払い・アカウント作成・D-U-N-S 申請・Android 実装を止め、iOS v1.0/v1.1 と
      LLM の実績を 11/13 まで見て、総損失上限の残額を確定してから再開する。
    cost: "0 円（今回の期間）。Android の公開は 2027-02 以降。"
    pros:
      - "予算の矛盾を解消してから進められる"
      - "iOS のリソースを完全に守れる"
    cons:
      - "Android の公開が遅れる"
      - "D-U-N-S の待ち時間を後ろにずらすだけ"
    recommendation: false

recommendation:
  option: A
  conditional: >-
    LLM 費用を総損失上限に含めない会計で、広告を 0 円にし、端末を借用でき、D-U-N-S を無料 30 営業日で
    待てる場合のみ A が成立する。LLM を上限内に含める会計なら A は成立しないため、B（上限増額）か
    C（延期）を選ぶ。有料 D-U-N-S 15,000 円は、固定費込みの会計では A でも成立しない。
  rationale: >-
    Issue の前提（Play は上限内）を守るなら、広告 0・端末借用・無料 D-U-N-S が最も自然。
    ただし既知の固定費だけでも 30,300 円になるため、Fin #126 の再計算とオーナーの会計判断が先。
    支払い前に決める。決まるまで Play の 25 USD・有料 D-U-N-S・事業用住所/電話/ドメインの新規契約をしない。

decision: null
