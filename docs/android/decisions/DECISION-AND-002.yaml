id: DECISION-AND-002
title: Play 登録 25 USD と Android 検証端末の予算計上（総損失上限 3 万円）
status: open
created_at: "2026-10-20T23:58:00+09:00"
updated_at: "2026-10-20T23:58:00+09:00"
issue: 119
repo: Ryoki63/Challenge
route_class: critical_review
decider: Ryoki63
accountable: pmo-lead
co_accountable: fin-lead
deadline: "2026-10-27T18:00:00+09:00"
question: >-
  Play 登録 25 USD（約 3,700 円 / 1 USD=150 円なら 3,750 円）と、個人アカウントの端末確認に使う
  Android 実機の費用を、DECISION-006 の総損失上限 30,000 円の内側にどう計上しますか。
  既知の固定費 + 広告上限 + Play だけで 30,300 円になり、300 円超えます。LLM 費用を上限内に
  数える会計なら、さらに大きく超えます。

context:
  - "Issue #119 は『Play 登録 25 USD（約 3,700 円）は DECISION-006 の総損失上限 3 万円の内数』としている。"
  - "marketing/plan.md §5 の既知の固定費は Apple Developer Program 12,800 円/年 + Supabase Pro 25 USD/月（1 USD=150 円で 3,750 円/月）= 16,550 円。広告の上限は 10,000 円。合計 26,550 円。"
  - "26,550 円 + Play 3,750 円 = 30,300 円で、30,000 円を 300 円超える。"
  - "役職の learnings では、LLM に $3/日を使うと 2026-10-31〜12-31 の 62 日で 29,485 円（1 USD=158.5 円）。これは総損失上限の 98.3%。この会計で LLM を上限内に数えると、Play 3,750 円を足すだけで 33,235 円になり、上限を超える。"
  - "Android の公開が 2027-01 まで伸びると、その間の Supabase Pro（11 月・12 月・1 月分 = 3,750 円 × 3 = 11,250 円）をどの計画に計上するかで上限の見え方が変わる。iOS の分と二重計上しないよう #126 が按分する。"
  - "個人アカウントは Android 10 以上の実機（非 root）で端末確認が必要。オーナーが実機を持っていない場合、借用（0 円）か購入（額は未見積）かを選ぶ必要がある。"
  - "Google の登録料は 25 USD の一度きり。D-U-N-S は無料。組織アカウントの事業用住所・電話・ドメインは、既存なら 0 円、新規なら実費（未見積）。"

options:
  - id: A
    label: "上限内に収める（広告 0・端末は借用・LLM の扱いを Fin が確定）"
    summary: >-
      広告枠を 0 円にし、Android 実機は借用する。Play 3,750 円を上限内に置く。
      LLM 費用を上限に含めるかを含めないかを #126 が確定し、含めるなら日次上限を下げる。
    cost: "Play 3,750 円 + 固定費 16,550 円 = 20,300 円（広告 0、端末借用）。残り 9,700 円。"
    pros:
      - "追加の承認なしで 30,000 円の内側に収まる（LLM を含めない会計の場合）"
      - "端末購入・広告出稿の判断を先送りできる"
    cons:
      - "LLM を上限内に含める会計では成立しない（29,485 円 + 3,750 円 = 33,235 円）"
      - "Supabase Pro の対象期間を広げると、さらに超過する"
      - "端末を借りられない場合は購入費が増える"
    recommendation: true

  - id: B
    label: "Play と Android 端末を上限の外に置く（上限を増額）"
    summary: >-
      Play 3,750 円と端末購入費を「プラットフォームの固定費」として総損失上限の外に置き、
      上限を 3,750 円以上増額する。LLM の扱いは別に決める。
    cost: "上限 30,000 円 + Play 3,750 円 + 端末購入費（未見積）。"
    pros:
      - "LLM の日次上限を下げずに済む"
      - "端末を購入できる"
    cons:
      - "総損失上限の意味が変わる。オーナーの再承認が必要"
      - "「損失はそれほど大きくしない」という前提から外れやすい"
      - "広告・Supabase の追加月も同じ論法で外に出したくなる"
    recommendation: false

  - id: C
    label: "Android を延期し、予算を再基準化してから始める"
    summary: >-
      Play の支払い・アカウント作成・Android 実装を止め、iOS v1.0/v1.1 と LLM の実績を
      11/13 まで見て、総損失上限の残額を確定してから再開する。
    cost: "0 円（今回の期間）。Android の公開は 2027-02 以降。"
    pros:
      - "予算の矛盾を解消してから進められる"
      - "iOS のリソースを完全に守れる"
    cons:
      - "Android の公開が遅れる"
      - "D-U-N-S の待ち時間を後ろにずらすだけ"
    recommendation: false

recommendation:
  option: A
  conditional: >-
    LLM 費用を総損失上限に含めない会計で、広告を 0 円にし、端末を借用できる場合のみ A が成立する。
    LLM を上限内に含める会計なら A は成立しないため、B（上限増額）か C（延期）を選ぶ。
  rationale: >-
    Issue の前提（Play は上限内）を守るなら、広告 0・端末借用が最も自然。
    ただし既知の固定費だけでも 30,300 円になるため、Fin #126 の再計算とオーナーの会計判断が先。
    支払い前に決める。決まるまで Play の 25 USD を支払わない。

decision: null
decided_at: null
decided_by: null

consequences:
  A:
    - "広告枠を 0 円にする（marketing/plan.md §5 の 10,000 円を閉じる）。"
    - "Android 実機は借用する。購入が必要なら別の判断カードを出す。"
    - "#126 が LLM の扱いと Supabase の対象期間を確定する。"
    - "Play の支払いは 10/27 までに実行する（A の日程を守る場合）。"
  B:
    - "DECISION-006 の上限を増額する判断カードを別に作り、オーナーの承認を取る。"
    - "Play の支払いと端末購入は、増額の承認後に行う。"
  C:
    - "Play のアカウント作成・支払い・Android 実装を停止する。"
    - "11/13 以降に、LLM の実績・Supabase の請求・iOS の収益を見て再計画する。"

