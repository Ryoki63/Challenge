consequences:
  A:
    - "11/1〜11/5 にオーナーが Play 個人アカウントを作成・支払い・本人確認・端末確認を行う（10/24〜10/31 の iOS 保護期間後）。"
    - "11/1 から知人へ個別に打診し、11/13 までに 12 人以上の見込みを作る。足りなければ B に切り替える。"
    - "12/15〜12/28 の 14 日連続クローズドテスト。12/28 に 12 人未満なら本番申請しない。"
    - "公開目標は 2027-01-06（ビルドが 12/7 に間に合う場合）。"
  B:
    - "10/23 に開業届・屋号・事業用住所/電話/ウェブサイトを確認し、D-U-N-S を申請する（無料 30 営業日が既定）。"
    - "12/8 頃の発番後、D&B の反映を確認し、組織アカウントを作成して 25 USD を支払う。"
    - "12 人 × 14 日は不要。12/7 のビルドで内部テスト 7 日→本番申請→審査。"
    - "公開目標は有料 D-U-N-S なら 2026-12-23 頃、無料の標準は 2027-01-07 頃、D&B 反映が最長なら 2027-03 頃。"
    - "組織の法的名称・住所・開発者電話が Play 上に公開される。"
  C:
    - "Android のアカウント作成・支払い・実装を停止する。"
    - "iOS v1.1 の 11/12〜13 公開後に、A/B を再評価する。"

