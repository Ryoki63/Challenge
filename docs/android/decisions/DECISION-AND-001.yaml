consequences:
  A:
    - "10/23〜10/27 にオーナーが Play 個人アカウントを作成・支払い・本人確認・端末確認を行う。"
    - "10/27 から事前打診を始め、11/13 までに 12 人以上の見込みを作る。足りなければ B に切り替える。"
    - "12/15〜12/28 の 14 日連続クローズドテスト。12/28 に 12 人未満なら本番申請しない。"
    - "公開目標は 2027-01-06（ビルドが 12/7 に間に合う場合）。"
  B:
    - "10/23 に開業届・屋号・事業用住所/電話/ドメインを確認し、D-U-N-S を申請する。"
    - "D-U-N-S と組織確認が終わるまで Play のアカウント作成を完了できない。"
    - "12 人 × 14 日は不要。ビルド完成後に内部テスト→本番申請→公開。"
    - "公開目標は 2026-12-23（D-U-N-S が 11/22 まで、組織確認が 12/1 までに終わる場合）。"
  C:
    - "Android のアカウント作成・支払い・実装を停止する。"
    - "iOS v1.1 の 11/12〜13 公開後に、A/B を再評価する。"

