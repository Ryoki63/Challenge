id: DECISION-AND-001
title: Android の Play アカウント種別とテスター確保策
status: open
created_at: "2026-10-20T23:55:00+09:00"
updated_at: "2026-10-20T23:55:00+09:00"
issue: 119
repo: Ryoki63/Challenge
route_class: critical_review
decider: Ryoki63
accountable: pmo-lead
deadline: "2026-10-23T18:00:00+09:00"
question: >-
  Android の Google Play 公開を、A（個人アカウント + テスター 15〜20 人を募集）と
  B（組織アカウント + D-U-N-S）のどちらで進めますか。A は「テスターを募集しない」という
  2026-10-20 22:20 のオーナー指示と両立しません。B は募集不要ですが、個人事業主の開業・
  事業用の住所/電話/ドメイン・D-U-N-S が必要で、法的名称・住所・電話が Play 上に公開されます。

context:
  - "Google Play の個人アカウント（2023-11-13 以降に作成）は、本番アクセスの申請前に 12 人以上が 14 日間連続でクローズドテストにオプトインしている必要がある。"
  - "組織アカウントはこの 12 人 × 14 日の対象外。ただし D-U-N-S 番号、組織名・住所・電話・ウェブサイト、公式の組織書類が必要で、D-U-N-S は最大 30 日かかりうる。"
  - "個人アカウントは Play Console モバイルアプリで Android 10 以上の実機（非 root）の端末確認が必要。"
  - "個人アカウントは法的な氏名・国・開発者メールを表示し、課金時は完全な住所も表示する。組織アカウントは法的名称・住所・メール・電話を表示する。"
  - "2026-10-20 21:33 時点で X は 0 posts / 0 followers。early-pairs は確定 0 組で、募集は 10/22〜23 開始予定。既存の供給だけでは 12 人に届く証拠がない。"
  - "個人 → 組織へのアカウント種別変更は可能（新しい支払いプロファイルを作成・確認してリンクする）。組織 → 個人は不可。"
  - "iOS v1.0 の 10/31 公開と v1.1 の 11/12〜13 公開が最優先。Android のコードは 11/13 まで main に入れない。"

options:
  - id: A
    label: "個人アカウント + テスター 15〜20 人を募集（推奨）"
    summary: >-
      10/23 に個人アカウントを作成し、10/27 までに本人確認・端末確認を終える。10/27 から知人・early-pairs・X へ
      事前打診を始め、15〜20 人を集める。11/13 に 12 人の見込みを判定し、足りなければ B に切り替える。
      12/15〜12/28 の 14 日連続クローズドテストを行う。
    cost: "Play 25 USD（約 3,700 円 / 1 USD=150 円なら 3,750 円）。端末は借りる前提で 0 円。テスターへの金銭・商品・割引は 0 円。"
    days_to_account: "1〜5 日（本人確認・端末確認の待ちを含む）"
    days_to_public: "ビルド完成後 29〜32 日（内部テスト 7 日 + 14 日連続テスト + 本番審査 7 日以内 + 予備）"
    pros:
      - "現金支出が最も小さい"
      - "アカウント有効化が早い（10/27 目標）"
      - "法的な事業実体・事業用住所/電話/ドメインが不要"
      - "個人 → 組織への変更が可能なので、後から B に移れる"
      - "実ユーザーのフィードバックが本番申請に使える"
    cons:
      - "12 人を集める不確実性がある（現在の early-pairs 0、X 0 followers）"
      - "14 日間の途中辞退でやり直しになる"
      - "本番アクセス審査でテストの質を問われる"
      - "個人アカウントは法的氏名・国・メール、課金時は住所が公開される"
      - "端末確認のため Android 10 以上の実機が必要"
    policy: "Google の公式要件に沿う。テスターへの金銭・商品・割引はインストール数操作と見なされうるので行わない。"
    recommendation: true

  - id: B
    label: "組織アカウント（D-U-N-S）"
    summary: >-
      10/23 に個人事業主の開業届（未提出なら）・屋号・事業用住所/電話/ドメインを用意し、D-U-N-S を申請する。
      D-U-N-S 取得後に組織アカウントを作成し、12 人 × 14 日なしで本番アクセスを申請する。
    cost: "Play 25 USD（約 3,700 円 / 1 USD=150 円なら 3,750 円）+ 事業用住所・電話・ドメインの実費（既存なら 0 円、新規なら未見積）。"
    days_to_account: "4〜44 日（D-U-N-S 0〜30 日 + 組織確認 3〜14 日）"
    days_to_public: "ビルド完成後 15〜17 日（内部テスト 7 日 + 本番審査 7 日以内 + 予備）"
    pros:
      - "12 人 × 14 日のクローズドテストが不要"
      - "D-U-N-S が早ければ A より早く公開できる"
      - "テスター募集の手間がない"
    cons:
      - "D-U-N-S の遅延・却下リスク（最大 30 日）"
      - "組織確認の却下リスク（書類・ウェブサイト・電話）"
      - "法的名称・住所・電話が Play 上に公開される"
      - "個人事業主の開業・事務・税務の負担"
      - "事業用住所/電話/ドメインの費用で総損失上限を超えやすい"
      - "組織 → 個人への変更は不可"
    policy: "Google の公式要件に沿う。D-U-N-S は無料。個人事業主の組織登録は成功事例があるが、Google が必ず承認する保証はない。"
    recommendation: false

  - id: C
    label: "保留（iOS v1.1 の後に再判断）"
    summary: >-
      Android のアカウント作成・支払い・実装を止め、iOS v1.0（10/31）と v1.1（11/12〜13）に集中する。
      11/13 以降に A/B を再評価する。
    cost: "0 円（今回の期間）"
    days_to_account: "再開後 1〜44 日（選択する案による）"
    days_to_public: "再開後 3〜8 週間"
    pros:
      - "iOS のリソースを完全に守れる"
      - "Android の範囲・技術選定・テスターの見込みを落ち着いて決められる"
    cons:
      - "Android の公開が 2027-02 以降になる"
      - "D-U-N-S の待ち時間を後ろにずらすだけ"
      - "オーナーの「Android も進める」指示に反する"
    policy: "問題なし（何もしない）"
    recommendation: false

recommendation:
  option: A
  fallback: B
  fallback_trigger: "2026-11-13 18:00 時点で、12 人以上のオプトイン見込みが立たない場合"
  rationale: >-
    A は現金支出が小さく、アカウント有効化が早く、法的な事業実体が不要で、個人 → 組織の変更も可能。
    12 人集めの不確実性は、15〜20 人への声かけと 11/13 のフォールバックで管理する。
    B は募集不要だが、D-U-N-S の最大 30 日・組織確認・住所/電話の公開・費用の不確実性が大きく、
    「損失はそれほど大きくしない」というオーナーの意向に合いにくい。

decision: null
