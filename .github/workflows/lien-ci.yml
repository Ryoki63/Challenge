# Lien CI — deno test(DESIGN §8: ubuntu 等倍・全 push で起動)
# iOS ビルドジョブは T06 で別ワークフロー(products/lien/ios/** 変更時のみ起動)として追加する
#
# ジョブ: deno-test(Edge Functions とその契約フィクスチャ)/ ops-tests(ファイルを読む運用の静的テスト — issue #66)/
#         e2e-tests(本番に対する API 通しテストの単体テストと型検査 — issue #67。通しテスト本体は CI で動かさない)/
#         plant-assets(植物の SVG レイヤーの再生成と検査)/ store-metadata(ストア文言・スクショ・プレス素材の静的検査)
#
# action は commit SHA で固定する(タグは付け替えられる。lien-deploy・lien-ios などと同じ方針)。
# 更新するときは、新しいタグが指す commit を確かめてから(gh api repos/<owner>/<repo>/commits/<tag> --jq .sha)差し替える
name: lien-ci

on:
  push:
  workflow_dispatch:

jobs:
  deno-test:
    name: deno test (supabase functions)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/lien/supabase/functions
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Run deno test
        run: deno test

      - name: Synthetic PostgreSQL RLS boundaries (no Supabase connection)
        run: deno test --config ../tests/deno.json --frozen --allow-read --allow-env=NODE_ENV ../tests/

      # 契約フィクスチャ(products/lien/contracts/*.json)がサーバー実装の現在の出力と一致するか。
      # 上の `deno test` は contracts/tools を含まないので別に回す。ずれたまま放置すると、iOS の
      # ContractFixtureTests が古い形を前提にデコードを検証し続ける(contracts/README.md)。
      # 差分が出たら generate.ts で再生成し、レビューしてからコミットする
      - name: Contract fixtures match the server handlers
        run: |
          deno run --allow-read ../../contracts/tools/generate.ts --check
          deno test --allow-read ../../contracts/tools/

  # 運用(products/lien/scripts/ops/)の静的テスト。cron の式・「JST の1日だけ」の条件・呼び先・鍵・本文(migration の文面を検査)、
  # push を送る Function の push_env の読み忘れ(index.ts / core.ts と _shared の文面を検査)、本番 cron の監視の判定ロジック。
  # 上の `deno test`(deno-test ジョブ)は --allow-read を付けないので、ファイルを読むこれらはここで別に回す。
  # 以前は lien-cron-watch の中にあって、関係するファイルが変わったときだけ回っていた。全 push で回すためにここへ統合した(issue #66)
  ops-tests:
    name: ops tests (cron static + push_env static + check logic)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Run ops tests
        run: deno test --allow-read products/lien/scripts/ops/

  # 本番に対する API 通しテスト(products/lien/scripts/e2e/。issue #67)の単体テストと型検査。通しテスト本体(run.sh)は
  # 本番にテスト用の匿名ユーザーを作る手動実行専用なので、ここでは動かさない(CI=true では E2E_ALLOW_CI=1 が無いと止まる)。
  # 単体テストはネットワークを使わない(--allow-net を付けない): 後片付けの安全装置(本番のユーザーを誤って消さない)・
  # 招待 token の形(サーバーの文字集合との一致 — invite-create/core.ts を import して比べる)・契約フィクスチャとの形の突き合わせ・
  # 引数の解釈。型検査は e2e.ts から辿れる全モジュール(手順 S01〜S22 を含む)に効く。
  # 以前は、これらが CI で一度も走っていなかった(ops-tests の対象は scripts/ops/ だけ)
  e2e-tests:
    name: e2e tests (unit + type check; no network)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Run e2e unit tests
        run: deno test --allow-read products/lien/scripts/e2e/

      - name: Type check the e2e runner
        run: deno check products/lien/scripts/e2e/e2e.ts

      # 審査用デモの相手役(issue #30 / T30)の単体テストと型検査。partner.ts 本体は本番に匿名ユーザーを作る
      # 手動実行専用なので、CI ではネットワークを付けず、純粋な部分(引数・JST の日付・状態ファイル・招待コードの形)
      # だけを確かめる(partner_lib_test.ts は fetch を import しない)
      - name: Run review-demo unit tests
        run: deno test products/lien/scripts/review-demo/

      - name: Type check the review-demo partner CLI
        run: deno check products/lien/scripts/review-demo/partner.ts

  plant-assets:
    name: plant layers (generate + verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/lien/assets/plant
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ツールの単体テスト(生成の決定論・verify が禁止要素やレイヤーの過不足を見逃さないこと・重ね順)。標準ライブラリだけ
      - name: Tool unit tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      # SVG レイヤー34点を再生成し、コミット済みの生成物と一字一句同じか確かめる(生成し忘れ・手で直した SVG・消し忘れを止める)。
      # ubuntu でもローカルの macOS と同じ出力になるよう、三角関数の誤差は丸めてある(tools/gen_v4.py)
      - name: Regenerate layers + catalog (must match what is committed)
        run: |
          python3 tools/gen_layers.py
          python3 tools/build_asset_catalog.py
          if ! git diff --exit-code -- . ; then
            echo "::error::生成物がコミット済みの内容と違います。python3 tools/gen_layers.py && python3 tools/build_asset_catalog.py を実行して、差分をコミットしてください"
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard -- .)"
          if [ -n "$untracked" ]; then
            echo "::error::コミットされていない生成物があります: $untracked"
            exit 1
          fi

      - name: Verify layers + asset catalog
        run: python3 tools/verify_assets.py

      - name: Validate Contents.json (json.tool)
        run: |
          count=0
          for f in $(find PlantAssets.xcassets -name Contents.json | sort); do
            python3 -m json.tool "$f" > /dev/null
            count=$((count + 1))
          done
          echo "validated $count Contents.json files"
          test "$count" -eq 35  # ルート1 + imageset 34

  store-metadata:
    name: store metadata (limits + banned words + keyword overlap + Pairy ban)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/lien/marketing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Verify store_metadata/ja (T32: 文字数制限 + 罰なし原則 + keywords の重複/表示名との重複 + Pairy 語の不在)"
        run: python3 tools/verify_metadata.py

      # ストア用スクリーンショット(issue #80 / MK7)。6.7in / 6.1in 各6枚の寸法・アルファなし・
      # captions.json と manifest.json(SHA-256)の一致・一覧画像の有無を、Pillow 無しで確かめる。
      # 画像は CI(lien-ios)の artifact からコミットする。文言を変えて画像を作り直していないと落ちる
      - name: "Verify store screenshots (issue #80: 寸法 + アルファなし + captions/manifest の一致)"
        run: python3 tools/verify_screenshots.py

      # 紹介・プレス向け素材(issue #94 / M8)。紹介文3種の文字数・必須項目・v1.0 の範囲・
      # 将来価格/実績値の不在・スクショ3枚(1290×2796・アルファなし・元画像と SHA-256 一致)を確かめる
      - name: "Verify press kit (issue #94: 文字数 + 必須項目 + v1.0 の範囲 + スクショ3枚)"
        run: python3 tools/verify_press.py

      - name: "Test verify_metadata.py (検査ロジックの単体テスト)"
        run: python3 -m unittest discover -s tools -p "test_*.py" -v

      # X の投稿案(issue #75)の静的検査。本文140字・禁止語/誇大表現・競合名・日付の断定・
      # 根拠の節の実在・添付画像の実在・承認前の status: ready を止める。
      # 下書きの追加・修正のたびに、レビュー前に機械で落とせるものはここで落とす
      - name: "Verify X post drafts (issue #75: 140字 + 禁止語 + 根拠 + 承認前 ready なし)"
        run: python3 x/tools/check_posts.py

      - name: "Test check_posts.py (検査ロジックの単体テスト)"
        run: python3 -m unittest discover -s x/tools -p "test_*.py" -v

  pages-site:
    name: pages site (md→html の生成物一致 + 公開前チェック)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/lien/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 落ちたときは `cd products/lien/web && python3 tools/build_site.py` で再生成してコミットする
      # (privacy-policy.md / terms.md が正本。HTML を手で直さない)
      - name: "生成物が md と一致するか(#76)"
        run: python3 tools/build_site.py --check

      - name: "ティザーと法務ページの検査(フォーム無し・スクショ3枚・禁止語・リンク切れ・SVG)"
        run: python3 -m unittest discover -s tools -p "test_*.py" -v
