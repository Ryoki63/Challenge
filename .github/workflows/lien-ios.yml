# Lien iOS CI — xcodegen generate → xcodebuild(DESIGN §8)
# CI 予算: macOS ランナーは10倍消費のため products/lien/ios/** 変更時のみ起動する(timeout-minutes: 20 は安全弁)。
# 所要の内訳(2026-10-13 の実測。ランナーによって 2〜3 倍ぶれる): 全体で 12〜13 分 = 準備 約 1 分 + シミュレータの
# 初回起動 4〜6 分(データ移行。「Boot the iOS simulator」ステップ)+ ビルド 2〜4 分 + ビルドの終わりからテストの開始まで
# 約 2 分 + テスト本体 約 15 秒 + 後片付け 約 0.5 分。当初の目標「8分以内」は、初回起動が入ると届かない(issue #66)
#
# Xcode は products/lien/ios/.xcode-version の版に固定(lien-release と共通 — issue #28)。
# 2026-04-28 以降、App Store Connect へのアップロードは Xcode 26 / iOS 26 SDK 以上が必須なので、
# テストも同じ SDK で回して「TestFlight に上げるビルドと同じコンパイラで通る」ことを毎回確かめる。
# XcodeGen も版と SHA-256 を固定する(ios/scripts/install-xcodegen.sh。lien-release と共通 — issue #66)。
# action は commit SHA で固定する(タグは付け替えられる。lien-deploy と同じ方針)。
name: lien-ios

on:
  push:
    paths:
      - "products/lien/ios/**"
      # 契約フィクスチャ(サーバーの実ハンドラ出力)は LienTests のリソース(project.yml が ../contracts を参照 — issue #55)。
      # サーバーの応答形が変わって再生成されたときも iOS のデコード検証を走らせる
      - "products/lien/contracts/**"
      # 植物の SVG レイヤーのカタログは Lien / LienWidget ターゲットのリソース(project.yml が ../assets/ を参照 — T13・issue #56)。
      # アセット側だけの変更でも iOS ビルドが走るようにする。PlantLayersTests は重ね順の基準(layer_stacks.json)と
      # のぞきの位置(peek_offsets.json)も読むので、その変更でも走らせる
      - "products/lien/assets/plant/PlantAssets.xcassets/**"
      - "products/lien/assets/plant/layer_stacks.json"
      - "products/lien/assets/plant/peek_offsets.json"
      # プロフィールのアバター12種のカタログは Lien ターゲットのリソース(project.yml が ../assets/avatar を参照)。
      # アセット側だけの変更でも iOS ビルドが走るようにする。LienAvatarTests は並び順と名前の基準(avatars.json)も読むので、その変更でも走らせる
      - "products/lien/assets/avatar/AvatarAssets.xcassets/**"
      - "products/lien/assets/avatar/avatars.json"
      # アプリアイコンの正本。ios の AppIcon.appiconset と同一であることを ReleaseReadinessTests が検査する(issue #28)
      - "products/lien/assets/icon/**"
      # 罰なし文言の lint(StringsReviewTests)は、サーバー側の禁止ワード BANNED_PATTERN をこのファイルから読み、
      # Swift 版(PunishmentFreeLint)と一致しているかを検査する。サーバー側だけの変更でも、その整合検査を走らせる(issue #66)
      - "products/lien/supabase/functions/_shared/messages_test.ts"
      - ".github/workflows/lien-ios.yml"
  workflow_dispatch:

# 同一ブランチで古い実行をキャンセルして macOS 分を節約
concurrency:
  group: lien-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: iOS build + test (simulator / no codesign)
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: products/lien/ios
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ios/.xcode-version の Xcode に切り替え、iOS 26 SDK 以上であることを確かめる(lien-release と共通)
      - name: Select Xcode (pinned) + iOS 26 SDK check
        run: scripts/select-xcode.sh

      # リリース用スクリプト(Supabase 接続情報の検証・archive の検査・Package.resolved の比較・XcodeGen の導入・
      # シミュレータの起動・リリース前の CI 確認・必須理由 API の棚卸し)の単体テスト。数秒
      - name: Release script unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      # XcodeGen は brew の「その時点の最新」ではなく、版と SHA-256 を固定して入れる(lien-release と共通)。
      # 版は step summary にも出す。上げるときは scripts/install-xcodegen.sh の冒頭の手順に従う(issue #66)
      - name: Install XcodeGen (pinned)
        run: scripts/install-xcodegen.sh

      - name: Generate Xcode project
        run: xcodegen generate

      # コミット済みの ios/Package.resolved を .xcodeproj へ戻して解決し、ずれていたら止める。
      # 以降の xcodebuild は -onlyUsePackageVersionsFromResolvedFile で、この固定を必ず使う(issue #28)
      - name: Pin Swift packages (Package.resolved)
        run: scripts/pin-packages.sh

      # ストア用スクリーンショット(issue #80)の来歴。StoreScreenshotRenderTests が manifest.json に取り込む。
      # 画像がどのコミット・どの実行から作られたかを G4 で辿れるようにする(テストは iOS シミュレータで動くため、
      # 環境変数ではなくファイルで渡す)
      - name: Record CI provenance (store screenshots)
        run: |
          mkdir -p build/store-screens
          printf '{"commit":"%s","runId":"%s","runAttempt":"%s","workflow":"lien-ios","repository":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_REPOSITORY" > build/store-screens/ci.json

      # シミュレータの起動を、ビルド・テストから切り離して所要を見えるようにする(issue #66)。
      # Build & test が 10〜13 分に伸びたとき、ログには「ビルドが終わってからテストが始まるまでの 2〜8 分の空白」があった。
      # xcodebuild が自分でシミュレータを起動して待っていた時間で、ステップの内訳には出てこなかった。
      # ここで起動して待てば、起動だけの所要がこのステップの時間とジョブサマリに出る。次のステップは同じ 1 台(UDID)を使う
      - name: Boot the iOS simulator (iPhone 17)
        id: simulator
        timeout-minutes: 15
        run: python3 scripts/boot_simulator.py "iPhone 17" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

      # xcodebuild test はビルドも行うため、ビルドとテストを1ステップに統合して
      # macOS 分を節約する(T07)。LienTests は Lien スキームの testTargets(project.yml)。
      # destination は、上のステップで起動した "iPhone 17"(macos-26 / Xcode 26.x の標準シミュレータ。iPhone 16 は
      # macos-26 のイメージに無い)を UDID で指す。OS バージョンは指定せず、ランナー既載の最新ランタイムの 1 台
      #
      # -resultBundlePath: テストが XCTAttachment で保存した植物の実描画の一覧画像(PlantRenderTests。issue #56)を、
      # あとで xcresult から取り出すため
      - name: Build & test (Lien scheme, iOS Simulator)
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project Lien.xcodeproj \
            -scheme Lien \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -onlyUsePackageVersionsFromResolvedFile \
            -resultBundlePath "$RUNNER_TEMP/Lien.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      # ---- 植物の実描画の一覧画像(GROWTH §9.5 の承認ゲート。テストが失敗しても残す = if: always())
      # 一覧画像は PlantRenderTests が 2 か所に保存する。どちらかが取れれば見られる:
      #   1. ios/build/plant-render/*.png(ホストのファイルとして直接書く)→ artifact「plant-render-sheets」
      #   2. XCTAttachment(xcresult の中)→ xcresulttool で取り出して artifact「plant-render-sheets-xcresult」
      # xcresult 自体も artifact「xcresult」に残す(Xcode で開いて、失敗したテストの詳細を見られる)
      - name: Export plant render sheets from the xcresult
        if: always()
        continue-on-error: true
        run: python3 scripts/export_attachments.py "$RUNNER_TEMP/Lien.xcresult" "$RUNNER_TEMP/plant-render-xcresult" --prefix plant_

      - name: List plant render sheets
        if: always()
        run: |
          echo "--- ios/build/plant-render/"; ls -la build/plant-render 2>&1 || true
          echo "--- exported from the xcresult"; ls -la "$RUNNER_TEMP/plant-render-xcresult" 2>&1 || true
          {
            echo "### 植物の実描画の一覧画像(GROWTH §9.5 の承認ゲート)"
            echo "この実行の artifact: \`plant-render-sheets\`(テストが書いた PNG)/ \`plant-render-sheets-xcresult\`(xcresult から取り出した同じ画像)/ \`xcresult\`"
            echo
            ls -1 build/plant-render 2>/dev/null | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plant render sheets (written by the tests)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plant-render-sheets
          path: products/lien/ios/build/plant-render/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload plant render sheets (exported from the xcresult)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plant-render-sheets-xcresult
          path: ${{ runner.temp }}/plant-render-xcresult/
          if-no-files-found: warn
          retention-days: 30

      # ---- ストア用スクリーンショット(issue #80 / MK7)
      # StoreScreenshotRenderTests が、本物の View を実寸で描いた画面(raw/)と、キャプションと合成した完成画像
      # (6.7in/ 6.1in/)、並べた一覧(contact-sheet-6.7in.png)、来歴(manifest.json)を build/store-screens/ に書く。
      # 完成画像を marketing/screenshots/ にコミットする(手順は marketing/screenshots/README.md)
      - name: List store screenshots
        if: always()
        run: |
          echo "--- ios/build/store-screens/"; ls -R build/store-screens 2>&1 || true
          {
            echo "### ストア用スクリーンショット(issue #80)"
            echo "artifact: \`store-screenshots\`(完成画像 6.7in/6.1in + raw/ + manifest.json + contact-sheet)"
            echo
            ls -1 build/store-screens/6.7in 2>/dev/null | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload store screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-screenshots
          path: products/lien/ios/build/store-screens/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload xcresult
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcresult
          path: ${{ runner.temp }}/Lien.xcresult
          if-no-files-found: warn
          retention-days: 7
