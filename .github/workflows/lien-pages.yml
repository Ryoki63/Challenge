# Lien Pages — 公開前ティザーと法務ページの配信(MK3 / issue #76)
#
# 配信するのは `products/lien/web/site/` だけ(リポジトリ全体は配信しない)。
# 中身は Markdown が正本で、`products/lien/web/tools/build_site.py` が組み立てる。
#
# 公開先(アプリの `SupportLinks.webBaseURL` と同じ土台):
#   https://ryoki63.github.io/Challenge/             … ティザー(1行説明・画面3枚・近日公開)
#   https://ryoki63.github.io/Challenge/lien/legal/  … プライバシーポリシー・利用規約
#   https://ryoki63.github.io/Challenge/lien/i/      … 招待ページ(T11)
#
# 【いまは手動起動だけ】push では走らせない。理由は2つ:
#   1. G4(#42)のプレースホルダが残っているあいだは公開できない(--check-publishable が止める)
#   2. 初回はリポジトリ設定の変更が要る(Settings > Pages > Build and deployment > Source を
#      「GitHub Actions」にする)。この設定は人間が行う。済むまで deploy は 404 で止まる
# G4 の記入と X の URL が入ったら、下の `on:` に push のパス条件を足せば自動配信になる。
#
# 秘密は使わない(GITHUB_TOKEN の pages:write と id-token だけ)。それでも action は commit SHA で固定する
# (タグは後から別のコミットに付け替えられるため — lien-deploy.yml と同じ方針)。
name: lien-pages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "生成と公開前チェックだけ(配信しない)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # 配信中に差し替えない

jobs:
  deploy:
    name: build + deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.4.0
        with:
          python-version: "3.12"

      # md を直して再生成し忘れたまま配信しない(コミット済みの site/ と生成結果を突き合わせる)
      - name: 生成物が md と一致するか
        working-directory: products/lien/web
        run: python3 tools/build_site.py --check

      # G4(#42)のプレースホルダ・未確定の X の URL があれば、ここで止まる(公開物に出さない)
      - name: 公開してよい状態か(G4 の記入・X の URL)
        working-directory: products/lien/web
        run: python3 tools/build_site.py --check-publishable

      - name: Configure Pages
        if: ${{ !inputs.dry_run }}
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact (products/lien/web/site)
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: products/lien/web/site

      - name: Deploy to GitHub Pages
        if: ${{ !inputs.dry_run }}
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
