# Lien deploy — Supabase へ migration + Edge Functions をデプロイ(T08準備①)
#
# 手動起動のみ(workflow_dispatch)。push では走らない=既存CI(lien-ci / lien-ios)と独立。
# 必要な GitHub secrets(リポジトリ Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN — https://supabase.com/dashboard/account/tokens で発行
#   SUPABASE_DB_PASSWORD  — プロジェクト作成時の DB パスワード(db push に必要)
# project ref は products/lien/supabase/config.toml に固定(env PROJECT_REF で上書き可)。
#
# 【action は commit SHA で固定する】この workflow は全権の SUPABASE_ACCESS_TOKEN と DB パスワードを渡す。
#   リポジトリは公開で、タグやブランチ(v4・v1 など)は後から別のコミットに付け替えられる。第三者の action が
#   細工されると、トークンやパスワードが流出しうる。そのため SHA で固定し、末尾のコメントにバージョンを書く。
#   更新するときは新しいバージョンのタグが指す commit を確かめてから(gh api repos/<owner>/<repo>/commits/<tag> --jq .sha)差し替える
name: lien-deploy

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "前提チェックのみ(link/db push/deploy を実行しない)"
        type: boolean
        default: false

concurrency:
  group: lien-deploy
  cancel-in-progress: false # デプロイの同時実行・途中キャンセルはしない

jobs:
  deploy:
    name: supabase db push + functions deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.105.0 # config.toml のスキーマ準拠バージョンに固定

      - name: Deploy (scripts/deploy.sh)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: bash products/lien/scripts/deploy.sh
