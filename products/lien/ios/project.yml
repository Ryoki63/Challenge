# project.yml — XcodeGen 定義(正本: docs/DESIGN.md §3.1〜§3.3)
#
# - .xcodeproj はコミットしない(products/lien/.gitignore 済み)。この YAML が正
# - Mac / CI では `xcodegen generate` → `xcodebuild build ...`(DESIGN §8)
# - Bundle ID / App Group は Config/Base.xcconfig の LIEN_BUNDLE_ID_BASE /
#   LIEN_APP_GROUP_ID に変数化している(G0 で人間が最終決定 — DESIGN §3.1。
#   変更時は Base.xcconfig の2行 + 各 *.entitlements を更新する)
# - 外部依存は supabase-swift と RevenueCat(v1.1 課金。DESIGN §3.1。どちらもタスク本文で明記)。
#   リンクするのは Lien ターゲットだけ(LienWidget / LienNSE には混ぜない — DESIGN §3.4)
# - 各ターゲットのフォルダにある PrivacyInfo.xcprivacy は sources に含まれ、リソースとして同梱される
#   (必須理由 API と収集データの宣言。issue #28。整合は LienTests/PrivacyManifestTests)

name: Lien

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# SPM 依存(exactVersion で固定 — issue #28。リリースビルドが、ある日突然別の版になって壊れるのを防ぐ)。
# 推移依存(swift-crypto など)も含めた解決結果は ios/Package.resolved にコミットしてあり、
# CI(lien-ios / lien-release)は xcodegen の後でそれを .xcodeproj へ戻して使う(scripts/pin-packages.sh)。
# 版を上げるとき: ここを変える → CI が「Package.resolved が古い」と出力する新しい内容を ios/Package.resolved に貼る
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: "2.55.3"
  # 課金(RevenueCat — T33 / REQUIREMENTS §3.14)。Lien ターゲットだけがリンクする。
  # API キーが無い CI では UnavailablePurchasesClient に切り替わり、この SDK は呼ばれない
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    exactVersion: "5.96.0"

# Debug / Release とも共通設定は Config/Base.xcconfig に置く。
# Base.xcconfig の末尾で Secrets.xcconfig を optional include しているため、
# Secrets が無い環境(CI)でもビルドが通る(DESIGN §7)。
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

targets:
  # ---------------------------------------------------------------- アプリ本体
  Lien:
    type: application
    platform: iOS
    sources:
      - path: Lien
      # 植物キャラクター v4「タネの子」の SVG レイヤー34点(正本: ../assets/plant — issue #56。生成は
      # assets/plant/tools/)。imageset 名は plant_<レイヤー名>(PlantLayers.assetPrefix)。
      # 重ねて描くのは PlantCharacterView。LienWidget にも同じカタログを入れる(ウィジェットでも描く)
      - path: ../assets/plant/PlantAssets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(LIEN_BUNDLE_ID_BASE)"
        CODE_SIGN_ENTITLEMENTS: Lien/Lien.entitlements
        # App Store Connect は AppIcon(1024 単一サイズ・アルファなし)が無いアップロードを弾く(ITMS-90022 / 90713)。
        # 画像は Lien/Assets.xcassets/AppIcon.appiconset(正本: ../assets/icon/icon_1024.png — v4 空色)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Lien/Info.plist
      properties:
        CFBundleDisplayName: Lien
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        # 招待ディープリンク lien://invite/<token>(T11 / DESIGN §3.6)
        CFBundleURLTypes:
          - CFBundleURLName: "$(LIEN_BUNDLE_ID_BASE).invite"
            CFBundleURLSchemes:
              - lien
        # Config.swift が xcconfig → Info.plist 経由で読む(DESIGN §3.3)
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
        LIEN_APP_GROUP_ID: "$(LIEN_APP_GROUP_ID)"
        # 課金(RevenueCat — T33)。空ならアプリは UnavailablePurchasesClient に切り替わる
        REVENUECAT_API_KEY: "$(REVENUECAT_API_KEY)"
        # サイレント push(content-available: 1 — checkin-cancel / promise-set の pair_update)で
        # アプリを起こし、snapshot を GET /snapshot で取り直すため(AppDelegate / AppModel — issue #55)。
        # 可視 push は NSE が処理するので、これが無くても通知は届く(サイレントのフォールバック経路用)
        UIBackgroundModes:
          - remote-notification
    dependencies:
      - target: LienWidget
      - target: LienNSE
      # supabase-swift はアプリ本体のみ(Widget/NSE は App Group 経由の読み取り設計を維持)
      - package: Supabase
        product: Supabase
      # 課金(RevenueCat — T33)。Lien ターゲットのみ(Widget / NSE には入れない)
      - package: RevenueCat
        product: RevenueCat
    scheme:
      testTargets:
        - LienTests

  # ------------------------------------------------------ ウィジェット拡張
  LienWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: LienWidget
      # App Group 共有契約のモデル/ストア/文言をアプリ本体とソース共有(T07)。
      # ウィジェットは読み取り専用(DESIGN §3.4)
      - path: Lien/Core/Models/PairSnapshot.swift
      - path: Lien/Core/AppGroupStore.swift
      - path: Lien/Core/Strings.swift
      # 植物の描画(issue #56)。SwiftUI と Foundation と PairSnapshot だけに依存する純粋なファイルなので、
      # アプリ本体とソース共有する。カタログも同じものを入れる(全レイヤーを重ねてもウィジェットのメモリに収まるかは
      # 実機で確かめる — GROWTH §9.5)
      - path: Lien/Core/DesignSystem/PlantLayers.swift
      - path: Lien/Core/DesignSystem/PlantCharacterView.swift
      # 成長の進み具合(のぞきを出す判定 — PlantLayers の PlantCharacterState(snapshot:) が使う。PB #57)。
      # Foundation と PairSnapshot・PlantLayers だけに依存する純粋なファイル(ウィジェットの「細い進み具合のバー」でも使う)
      - path: Lien/Core/PlantProgress.swift
      # 植物の VoiceOver の読み上げ文(PlantVoiceOver。GROWTH §5.4: ウィジェットも「みどり、わかば。あなた: 完了、…」と読み上げる)。
      # Foundation と PairSnapshot・PlantProgress・PlantLayers・Strings だけに依存する純粋なファイル
      - path: Lien/Core/GrowthGauge.swift
      # ウィジェットの中身(issue #17 T17a): 何を見せるか(WidgetContent)・タイムラインの計画(WidgetTimelinePlan)・寸法(WidgetMetrics)の
      # 純粋関数と、ホーム S / M・ロック画面の円形・インラインのビュー(Widget/Views/)。**WidgetKit の TimelineProvider・WidgetBundle・
      # WidgetFamily だけが LienWidget/ にあり、それ以外はここ**。アプリ本体にも入る(LienTests が単体テストと一覧画像の描画をするため)。
      # フォルダごと入れる(ファイルを足しても、ここは直さない。PrivacyManifestTests の directories もこのフォルダを見る)
      - path: Lien/Core/Widget
      - path: ../assets/plant/PlantAssets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(LIEN_BUNDLE_ID_BASE).widget"
        CODE_SIGN_ENTITLEMENTS: LienWidget/LienWidget.entitlements
        # アプリ本体に埋め込まれる拡張。単独では archive に出さない(アプリの archive に Lien.app/PlugIns として入る)
        SKIP_INSTALL: "YES"
    info:
      path: LienWidget/Info.plist
      properties:
        CFBundleDisplayName: Lien
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LIEN_APP_GROUP_ID: "$(LIEN_APP_GROUP_ID)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # ---------------------------------------- Notification Service Extension
  LienNSE:
    type: app-extension
    platform: iOS
    sources:
      - path: LienNSE
      # App Group 共有契約のモデル/ストアをアプリ本体とソース共有(T07)
      - path: Lien/Core/Models/PairSnapshot.swift
      - path: Lien/Core/AppGroupStore.swift
      # ローカル通知(リマインド・ストリーク危機)の計画と規則(T16 #16)。アプリの同期(ReminderScheduler)と同じ計画・同じ規則で、
      # 相手の push を受けたときに、夜 9 時のストリーク危機の予約を合わせ(足りなければ足し、古ければ消す)、今日の分を取り消す
      # (LocalNotificationPushSync)。アプリを開かない日の夜 9 時の通知は、これが無いと届かない。
      # 通知センターへの要求(UserNotificationCenterScheduler)だけが UserNotifications を使い、ほかは Foundation だけに依存する
      - path: Lien/Core/Strings.swift
      - path: Lien/Core/Notifications/LocalNotificationID.swift
      - path: Lien/Core/Notifications/NotificationScheduling.swift
      - path: Lien/Core/Notifications/NotificationPreferences.swift
      - path: Lien/Core/Notifications/StreakRiskPlan.swift
      - path: Lien/Core/Notifications/NotificationReconciler.swift
      - path: Lien/Core/Notifications/LocalNotificationPushSync.swift
      - path: Lien/Core/Notifications/PushSnapshotWriter.swift
      - path: Lien/Core/Notifications/UserNotificationCenterScheduler.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(LIEN_BUNDLE_ID_BASE).nse"
        CODE_SIGN_ENTITLEMENTS: LienNSE/LienNSE.entitlements
        SKIP_INSTALL: "YES"
    info:
      path: LienNSE/Info.plist
      properties:
        CFBundleDisplayName: Lien
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LIEN_APP_GROUP_ID: "$(LIEN_APP_GROUP_ID)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).NotificationService"

  # -------------------------------------------------------------- 単体テスト
  LienTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LienTests
      # iOS ⇔ サーバーの契約フィクスチャ(products/lien/contracts/*.json — サーバーの実ハンドラ出力。
      # ContractFixtureTests が本番と同じデコーダで読む)。JSON だけをテストバンドルのリソースに含める
      - path: ../contracts
        includes:
          - "*.json"
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(LIEN_BUNDLE_ID_BASE).tests"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Lien.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Lien"
        BUNDLE_LOADER: "$(TEST_HOST)"
    info:
      path: LienTests/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    dependencies:
      - target: Lien
