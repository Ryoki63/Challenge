# Lien — Supabase CLI 設定(最小構成。Supabase CLI 2.x)
#
# 正本: docs/DESIGN.md §5(functions)/ §7(シークレット)
# project_id はリモートプロジェクトの ref(G0 でユーザーが作成。issue #38)。
# `supabase link --project-ref` は deploy.sh が行う。
#
# verify_jwt = false の理由(全関数共通):
#   各 function は内部で自己認証する(ユーザー系は adminClient.auth.getUser(token)、
#   cron 系の close-day / grant-tickets は cron 専用シークレット LIEN_CRON_SECRET との
#   完全一致比較 — _shared/cron_http.ts。issue #60 で service role key から替えた)。
#   cron の秘密は JWT ではないため、gateway の JWT 検証を有効にすると cron 系が 401 になる。
#   検証は関数内の自己認証に一本化する。

project_id = "lniheehfbtpfhglinfjm"

[functions.checkin]
verify_jwt = false

[functions.checkin-cancel]
verify_jwt = false

[functions.snapshot]
verify_jwt = false

[functions.invite-create]
verify_jwt = false

[functions.invite-accept]
verify_jwt = false

[functions.promise-set]
verify_jwt = false

[functions.close-day]
verify_jwt = false

[functions.grant-tickets]
verify_jwt = false

[functions.nudge]
verify_jwt = false

[functions.react]
verify_jwt = false

[functions.plant-name]
verify_jwt = false

[functions.pair-dissolve]
verify_jwt = false

[functions.delete-account]
verify_jwt = false

# RevenueCat Webhook(T33)。RevenueCat は Supabase の JWT を送らない。
# 認証は関数内で REVENUECAT_WEBHOOK_AUTH との完全一致(定数時間比較)に行う(core.ts)
[functions.revenuecat-webhook]
verify_jwt = false
