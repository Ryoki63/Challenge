# Lien — Supabase CLI 設定(最小構成。Supabase CLI 2.x)
#
# 正本: docs/DESIGN.md §5(functions)/ §7(シークレット)
# project_id はリモートプロジェクトの ref(G0 でユーザーが作成。issue #38)。
# `supabase link --project-ref` は deploy.sh が行う。
#
# verify_jwt = false の理由(全7関数共通):
#   各 function は内部で自己認証する(ユーザー系は adminClient.auth.getUser(token)、
#   cron 系の close-day / grant-tickets は SERVICE_ROLE_KEY との完全一致比較)。
#   gateway の JWT 検証を有効にすると、新キー体系(sb_secret_...)は JWT ではないため
#   cron 系が 401 になる。検証は関数内の自己認証に一本化する。

project_id = "lniheehfbtpfhglinfjm"

[functions.checkin]
verify_jwt = false

[functions.checkin-cancel]
verify_jwt = false

[functions.snapshot]
verify_jwt = false

[functions.invite-create]
verify_jwt = false

[functions.invite-accept]
verify_jwt = false

[functions.close-day]
verify_jwt = false

[functions.grant-tickets]
verify_jwt = false
